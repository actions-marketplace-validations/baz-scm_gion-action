name: bump gion

# Makes a gion release the default `version` of every action, tests it,
# tags the next v1.x.y and moves v1 to it. Run it after each gion release
# (see CONTRIBUTING.md):
#
#   gh workflow run bump-gion.yml -R baz-scm/gion-action
on:
  workflow_dispatch:
    inputs:
      version:
        description: gion release to make the default, e.g. v0.3.2. Empty for the latest release.
        required: false

permissions:
  contents: write

concurrency:
  group: bump-gion
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.edit.outputs.changed }}
      sha: ${{ steps.commit.outputs.sha }}
      version: ${{ steps.version.outputs.version }}
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Pick the version
        id: version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ -z $VERSION ]]; then
            # The latest-release page redirects to .../tag/<version>. It never
            # points at a pre-release or a tag whose release didn't publish.
            url=$(curl -fsSLI --retry 3 -o /dev/null -w '%{url_effective}' https://github.com/baz-scm/gion/releases/latest)
            VERSION=${url##*/}
          fi
          if [[ ! $VERSION =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$VERSION' is not a release version (vX.Y.Z)"
            exit 1
          fi
          echo "VERSION=$VERSION" >>"$GITHUB_ENV"
          echo "version=$VERSION" >>"$GITHUB_OUTPUT"
      - name: Check out main with gion
        env:
          GION_INSTALL_DIR: ${{ runner.temp }}/bootstrap
        run: |
          curl -fsSL https://raw.githubusercontent.com/baz-scm/gion/main/install.sh | sh
          echo "$GION_INSTALL_DIR" >>"$GITHUB_PATH"
          "$GION_INSTALL_DIR/gion" clone "$GITHUB_REPOSITORY" . --ref main
      - name: Point the defaults at the new release
        id: edit
        run: |
          # Installing it proves the release has binaries for this runner.
          GION_VERSION=$VERSION scripts/install.sh
          current=$(awk '/^  version:/ { v = 1 } v && /^    default:/ { print $2; exit }' action.yml)
          newest=$(printf '%s\n' "${current#v}" "${VERSION#v}" | sort -V | tail -1)
          if [[ $current == "$VERSION" || $newest != "${VERSION#v}" ]]; then
            echo "::notice::the default is already $current; nothing to do for $VERSION"
            echo "changed=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          for f in action.yml checkout/action.yml changed/action.yml; do
            sed -i -E "/^  version:/,/^    default:/ s/^(    default: ).*/\1$VERSION/" "$f"
          done
          gion diff
          echo "changed=true" >>"$GITHUB_OUTPUT"
      - name: Push to main
        id: commit
        if: steps.edit.outputs.changed == 'true'
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          out=$(gion commit -m "feat: default to gion $VERSION" --to main --md)
          echo "$out"
          sha=$(grep -oE 'Commit: `[0-9a-f]{40}`' <<<"$out" | grep -oE '[0-9a-f]{40}')
          echo "sha=$sha" >>"$GITHUB_OUTPUT"

  # Pushes made with github.token don't trigger workflows, so run the tests
  # on the new commit here, before anything is tagged.
  test:
    needs: bump
    if: needs.bump.outputs.changed == 'true'
    uses: ./.github/workflows/test.yml
    with:
      ref: ${{ needs.bump.outputs.sha }}

  release:
    needs: [bump, test]
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ needs.bump.outputs.sha }}
      VERSION: ${{ needs.bump.outputs.version }}
    steps:
      - name: Install gion
        env:
          GION_INSTALL_DIR: ${{ runner.temp }}/bootstrap
        run: |
          curl -fsSL https://raw.githubusercontent.com/baz-scm/gion/main/install.sh | sh
          echo "$GION_INSTALL_DIR" >>"$GITHUB_PATH"
      - name: Tag the next v1.x.y and move v1
        run: |
          last=$(gion ls-refs "$GITHUB_REPOSITORY" --prefix refs/tags/v1. |
            awk '{ print $2 }' | sed -n -E 's#^refs/tags/(v1\.[0-9]+\.[0-9]+)$#\1#p' | sort -V | tail -1)
          IFS=. read -r major minor patch <<<"${last:-v1.0.-1}"
          next="$major.$minor.$((patch + 1))"
          gion tag "$GITHUB_REPOSITORY" "$next" "$SHA" -m "$next"
          # gion never moves a tag; v1 is lightweight, so point it at the commit.
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/v1" -f sha="$SHA" -F force=true
          gh release create "$next" -R "$GITHUB_REPOSITORY" --title "$next" \
            --notes "Defaults to gion [$VERSION](https://github.com/baz-scm/gion/releases/tag/$VERSION)."
